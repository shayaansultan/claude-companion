[project]
name = "claude-companion"
version = "0.1.0"
description = "Hand code review and general tasks to Claude Code from Codex"
# Standard library only. The upper bound matches the other plugins on this
# machine so uv reuses the same interpreter.
requires-python = ">=3.11,<3.14"
dependencies = []
readme = "README.md"
license = "MIT"
authors = [{ name = "Shayaan Sultan" }]
keywords = ["codex", "codex-plugin", "claude-code", "code-review", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/shayaansultan/claude-companion"
Changelog = "https://github.com/shayaansultan/claude-companion/blob/main/CHANGELOG.md"
Issues = "https://github.com/shayaansultan/claude-companion/issues"

[project.scripts]
claude-companion = "claude_companion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_companion"]
